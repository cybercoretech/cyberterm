[package]
name = "cyberterm"
version = "0.4.1"
edition = "2021"
rust-version = "1.88"
description = "A GPU terminal for developers: splits and sessions, command blocks, searchable history, AI help, inline images and Lua scripting"
license = "MIT"
repository = "https://github.com/cybercoretech/cyberterm"
homepage = "https://cybercoretech.github.io/cyberterm/"
readme = "README.md"
keywords = ["terminal", "terminal-emulator", "multiplexer", "gpu", "lua"]
categories = ["command-line-utilities", "development-tools"]

# Only what the build needs (themes/popular is bundled; the other theme
# collections are installed on request with `cyberterm +themes`).
include = [
    "src/**",
    "assets/default-config.toml",
    "assets/brand/cyberterm-icon.svg",
    "shell-integration/**",
    "themes/popular/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[lib]
name = "cyberterm_engine"
path = "src/lib.rs"

[dependencies]
# --- Core Terminal Engine & OS Primitives ---
alacritty_terminal = "0.26.0"   # Core matrix layout state, history buffer, and models --
                                 # also provides the real tty::new (PTY alloc + shell fork/exec)
                                 # and event_loop::EventLoop (PTY read -> vte -> Term wiring)
                                 # this project now uses directly instead of hand-rolling.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] } # Cross-platform window + Android NativeActivity surface
# futures is required to cleanly execute wgpu's async initialization methods
futures = "0.3"
wgpu = "24.0.0"                 # Modern low-overhead native GPU interface
glyphon = "0.8"                 # Real GPU text rendering (cosmic-text + etagere), wgpu ^24 --
                                 # verified against crates.io before pinning, matches wgpu above
parking_lot = "0.12"            # Low-overhead synchronization mutex primitive
polling = "3"                   # Same poller alacritty_terminal's PTY loop registers with --
                                 # needed to implement its EventedReadWrite for the OSC tap
                                 # wrapper in shell/tap.rs

# --- Configuration & Engine State Serialization ---
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"              # Comment-preserving edits when saving theme/opacity
serde_json = { version = "1.0.150", features = ["preserve_order"] } # keep JSON key order (+json viewer)
cybercore = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] } # command history (SQLite + FTS5), self-contained
regex = "1"                     # secret redaction in recorded history
libc = "0.2"                    # termios raw mode + window size for the terminal attach client
ureq = { version = "3", features = ["json"] }
png = "0.18"
base64 = "0.22"
miniz_oxide = "0.8"
mlua = { version = "0.10", features = ["serialize", "lua54", "vendored"] }

# Wayland clipboard + primary selection through the window's own
# connection (what Alacritty uses). Setting the primary selection via the
# data-control protocol, as arboard does, doesn't stick on Hyprland.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
smithay-clipboard = "0.7"
winit = { version = "0.30.13", features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.22"
winit = { version = "0.30.13", features = ["android-native-activity"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
arboard = "3"
